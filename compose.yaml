services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command:
      - --verbose
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_USER:-root}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_HOSTNAME_STRICT: false
      KC_FEATURES: persistent-user-sessions
      KC_HTTP_ENABLED: true
      KC_HTTP_MANAGEMENT_PORT: 9000
      KC_HTTP_PORT: 3000
      KC_LOG_LEVEL: INFO
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
      KC_TRANSACTION_JTA_ENABLED: false
      KC_TRANSACTION_XA_ENABLED: false
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`auth.${APP_HOST:-localhost}`)"
      - "traefik.http.routers.keycloak.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.keycloak.service=keycloak"
      - "traefik.http.services.keycloak.loadbalancer.server.port=3000"
      # Health endpoint on management port
      - "traefik.http.routers.keycloak-health.rule=Host(`auth.${APP_HOST:-localhost}`) && PathPrefix(`/health`)"
      - "traefik.http.routers.keycloak-health.entrypoints=web"
      - "traefik.http.routers.keycloak-health.service=keycloak-health"
      - "traefik.http.services.keycloak-health.loadbalancer.server.port=9000"
    volumes:
      - "./.docker/infra/keycloak/green-ecolution-realm.json:/opt/keycloak/data/import/green-ecolution-realm.json"
      - "./frontend/keycloak-theme/dist_keycloak/theme/green-ecolution:/opt/keycloak/themes/green-ecolution:ro"
    networks:
      default:
        aliases:
          - auth.localhost
    healthcheck:
      test:
        - "CMD"
        - "/bin/bash"
        - "-c"
        - |
          exec 3<>/dev/tcp/localhost/9000;
          echo -e "GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n" >&3;
          while IFS= read -r line; do
              if [[ "$$line" =~ "200 OK" ]]; then
                  echo "HTTP 200 OK response received from localhost";
                  exit 0;
              fi
          done <&3;

          echo "No HTTP 200 OK response received from localhost";
          exit 1;
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      keycloak-init-db:
        condition: service_completed_successfully

  keycloak-init-db:
    image: postgres:18
    user: "1001:1001"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: keycloak
    entrypoint: /bin/sh
    command: >
      -c "
      export PGPASSWORD=$$POSTGRES_PASSWORD;
      echo \"SELECT 'CREATE DATABASE $$POSTGRES_DB' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$$POSTGRES_DB')\\gexec\" |
      psql -U $$POSTGRES_USER -h db
      "
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -h localhost
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  pgadmin:
    image: dpage/pgadmin4:9.17
    entrypoint: /bin/sh
    command: >
      -c "echo \"$$SERVERS_JSON\" > /tmp/servers.json &&
      exec /entrypoint.sh"
    environment:
      SERVERS_JSON: |
        {
          "Servers": {
            "1": {
              "Name": "Green Ecolution",
              "Group": "Servers",
              "Port": 5432,
              "Username": "${POSTGRES_USER:-postgres}",
              "PasswordExecCommand": "echo '${POSTGRES_PASSWORD:-postgres}'",
              "Host": "db",
              "SSLMode": "prefer",
              "MaintenanceDB": "postgres"
            }
          }
        }
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      PGADMIN_DEFAULT_EMAIL: 1@1.com
      PGADMIN_DEFAULT_PASSWORD: "1"
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.${APP_HOST:-localhost}`)"
      - "traefik.http.routers.pgadmin.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
  # ors-app:
  #   image: openrouteservice/openrouteservice:v9.0.0
  #   ports:
  #     - "8080:8082"
  #     - "9001:9001"
  #   user: "1000:1000" # Default is 1000:1000. make infra/up will override this to the actual user values
  #   volumes:
  #     - ./.docker/infra/ors:/home/ors
  #   environment:
  #     ors.engine.profile_default.build.source_file: /home/ors/files/sh.osm.pbf
  #     REBUILD_GRAPHS: false
  #     CONTAINER_LOG_LAVEL: INFO
  #     XMS: 256m
  #     XMX: 512m
  #     ADDITIONAL_JAVA_OPTS: ""
  #   deploy:
  #     resources:
  #       reservations:
  #         cpus: "1"
  #         memory: 256m
  #       limits:
  #         cpus: "1"
  #         memory: 512m
  #   networks:
  #     - app-network

  streamlet:
    image: ghcr.io/green-ecolution/streamlet/server:0.2.0
    environment:
      STREAMLET_ADDR: "0.0.0.0:3000"
      STREAMLET_VALHALLA_URL: "http://valhalla:8002"
    ports:
      - "127.0.0.1:2510:3000"
    depends_on:
      valhalla:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          cpus: "1"
          memory: 150m
        limits:
          cpus: "1"
          memory: 150m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.streamlet.rule=Host(`streamlet.${APP_HOST:-localhost}`)"
      - "traefik.http.routers.streamlet.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.8.3
    volumes:
      - ./.docker/infra/valhalla/custom_files:/custom_files
    environment:
      server_threads: 20
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--silent",
          "--fail-with-body",
          "--max-time",
          "5",
          "http://localhost:8002/status",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        reservations:
          cpus: "1"
          memory: 256m
        limits:
          cpus: "2"
          memory: 1536m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.valhalla.rule=Host(`valhalla.${APP_HOST:-localhost}`)"
      - "traefik.http.routers.valhalla.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
  reverse-proxy:
    image: traefik:v3.7.13
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORKBUN_API_KEY=${PORKBUN_API_KEY:-}
      - PORKBUN_SECRET_API_KEY=${PORKBUN_SECRET_API_KEY:-}
    ports:
      - "${BIND_ADDR:-0.0.0.0}:3000:3000/tcp"
      - "${BIND_ADDR:-0.0.0.0}:3443:3443/tcp"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./.docker/infra/traefik/${TRAEFIK_CONFIG:-traefik.yaml}:/etc/traefik/traefik.yaml:ro"
      - "./.docker/infra/traefik/dynamic:/etc/traefik/dynamic:ro"
      - "./.docker/infra/traefik/certs:/etc/traefik/certs:ro"
      - "./.docker/infra/traefik/acme:/etc/traefik/acme"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${APP_HOST:-localhost}`)"
      - "traefik.http.routers.traefik.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.traefik.service=traefik"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"

  backend:
    profiles: ["app"]
    build:
      context: ./backend/
      args:
        - APP_VERSION=${APP_VERSION:-dev}
        - APP_REVISION=${APP_GIT_COMMIT:-unknown}
        - GE_GIT_COMMIT=${APP_GIT_COMMIT:-unknown}
        - GE_GIT_BRANCH=${APP_GIT_BRANCH:-unknown}
        - GE_BUILD_TIME=${APP_BUILD_TIME:-unknown}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/ready",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      - APP_ENVIRONMENT=local
      - APP_APPLICATION__HOST=0.0.0.0
      - APP_APPLICATION__PORT=3000
      - APP_APPLICATION__BASE_URL=${APP_PROTO:-https}://${APP_HOST:-localhost}:${APP_PORT:-3443}
      - APP_DATABASE__HOST=db
      - APP_DATABASE__PORT=5432
      - APP_DATABASE__DATABASE_NAME=${POSTGRES_DB:-postgres}
      - APP_DATABASE__USERNAME=${POSTGRES_USER:-postgres}
      - APP_DATABASE__PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - APP_LOG__LEVEL=info,sqlx=warn,tower_http=info
      - APP_LOG__FORMAT=json
      - APP_AUTH__ENABLED=true
      - APP_AUTH__ISSUER_URL=${APP_PROTO:-http}://auth.${APP_HOST:-localhost}:${APP_PORT:-3443}/realms/green-ecolution
      - APP_AUTH__FRONTEND_CLIENT_ID=frontend
      - APP_AUTH__BACKEND_CLIENT_ID=backend
      - APP_AUTH__BACKEND_CLIENT_SECRET=cVBGgWNlbwSLydLZfZMvTvmNCeiSmLGP
      - APP_AUTH__JWKS_REFRESH_INTERVAL_SECS=3600
      - APP_AUTH__JWKS_REFRESH_TIMEOUT_SECS=5
      - APP_AUTH__DEFAULT_REDIRECT_URL=${APP_PROTO:-https}://${APP_HOST:-localhost}:${APP_PORT:-3443}/auth/callback
      # routing (Valhalla/Vroom), MQTT and map config are not yet
      # implemented in backend-rs. Re-add the matching env vars once the Rust
      # Settings struct exposes those sections.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${APP_HOST:-localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/swagger-ui`) || PathPrefix(`/api-docs`))"
      - "traefik.http.routers.backend.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        - ENV=dev
        - BASEURL=/api
        - APP_VERSION=${APP_VERSION:-$(git describe --tags --always --dirty)}
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--silent",
          "--fail-with-body",
          "--max-time",
          "5",
          "http://localhost:80/status",
        ]
      interval: 2s
      timeout: 10s
      retries: 5
    depends_on:
      keycloak:
        condition: service_healthy
      backend:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${APP_HOST:-localhost}`)"
      - "traefik.http.routers.frontend.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  migrations:
    profiles: ["app"]
    build:
      context: ./backend/
      args:
        - APP_VERSION=${APP_VERSION:-dev}
        - APP_REVISION=${APP_GIT_COMMIT:-unknown}
        - GE_GIT_COMMIT=${APP_GIT_COMMIT:-unknown}
        - GE_GIT_BRANCH=${APP_GIT_BRANCH:-unknown}
        - GE_BUILD_TIME=${APP_BUILD_TIME:-unknown}
    entrypoint: ["./migrate"]
    command: ["reset", "--with-seed"]
    depends_on:
      db:
        condition: service_healthy
      keycloak-init-db:
        condition: service_completed_successfully
    environment:
      - APP_ENVIRONMENT=local
      - APP_DATABASE__HOST=db
      - APP_DATABASE__PORT=5432
      - APP_DATABASE__DATABASE_NAME=${POSTGRES_DB:-postgres}
      - APP_DATABASE__USERNAME=${POSTGRES_USER:-postgres}
      - APP_DATABASE__PASSWORD=${POSTGRES_PASSWORD:-postgres}

  demo-plugin:
    # Behind a profile so `just infra-up` does not build it; start it with
    # `just plugin-demo-up` when the plugin integration is being tested.
    profiles: ["plugins"]
    build:
      context: ./frontend
      dockerfile: demo-plugin/Dockerfile
    environment:
      # Points at the backend `just run-dev` runs on the host. Set it to
      # http://backend:3000/api to run against the `app` profile instead.
      - GE_API_BASE_URL=${GE_API_BASE_URL:-http://host.docker.internal:3030/api}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # A published localhost port, not a traefik host: an external plugin
    # frontend must be https unless its host is exactly `localhost`.
    ports:
      - "127.0.0.1:5175:80"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/api/session",
        ]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  db_data:
