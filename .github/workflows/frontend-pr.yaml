name: "Frontend - Pull Request Checks"

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      handbook: ${{ steps.filter.outputs.handbook }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'backend/crates/domain/**'
              - 'backend/crates/domain-wasm/**'
              - 'backend/Cargo.toml'
              - 'backend/Cargo.lock'
              - 'justfile'
              - '.github/workflows/frontend-pr.yaml'
              - '.github/actions/setup-frontend/**'
            docker:
              - 'frontend/Dockerfile'
              - 'frontend/.dockerignore'
              - 'frontend/pnpm-lock.yaml'
              - '.github/workflows/frontend-pr.yaml'
            handbook:
              - 'frontend/handbook/**'
              - 'frontend/app/vite.config.ts'
              - 'frontend/app/vitest.config.ts'
              - 'frontend/packages/ui/src/styles/globals.css'
              - '.github/workflows/frontend-pr.yaml'

  build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Build
        working-directory: ./frontend
        run: pnpm build

  lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Build workspace dependencies
        working-directory: ./frontend
        run: pnpm --filter=!frontend -r build
      - name: Lint
        working-directory: ./frontend
        run: pnpm lint

  test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Build workspace dependencies
        working-directory: ./frontend
        run: pnpm --filter=!frontend -r build
      - name: Test
        working-directory: ./frontend
        run: pnpm test

  handbook:
    needs: changes
    if: needs.changes.outputs.handbook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Generate manifest and typst sources
        run: node frontend/handbook/src/cli.mjs
      # frontend/Dockerfile pins the typst version the handbook layout was verified
      # against; read it here instead of duplicating it as a workflow literal.
      - name: Read pinned typst version
        id: typst_version
        run: |
          version="$(sed -n 's/^ARG TYPST_VERSION=\(.*\)/\1/p' frontend/Dockerfile)"
          if [ -z "$version" ]; then
            echo "::error::Could not read TYPST_VERSION from frontend/Dockerfile" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: ${{ steps.typst_version.outputs.version }}
      - name: Compile the handbook pdf
        run: |
          mkdir -p frontend/app/public/handbook
          typst compile \
            --root frontend/handbook \
            --font-path frontend/handbook/typst/fonts \
            --font-path frontend/app/public/fonts \
            frontend/handbook/typst/manual.typ \
            frontend/app/public/handbook/green-ecolution-handbuch.pdf
      - name: Upload the handbook pdf
        uses: actions/upload-artifact@v5
        with:
          name: green-ecolution-handbuch
          path: frontend/app/public/handbook/green-ecolution-handbuch.pdf
          if-no-files-found: error

  # The app build is already covered by the build job; this only needs to
  # run when the image definition itself changes.
  test_dockerfile:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - uses: docker/setup-buildx-action@v4
      - name: Test frontend Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: frontend:test
          cache-from: type=gha,scope=frontend-dockerfile
          cache-to: type=gha,mode=max,scope=frontend-dockerfile

  keycloak_theme:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Set up JDK for the keycloakify jar build
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure Maven is available
        run: command -v mvn || sudo apt-get install -y --no-install-recommends maven
      - name: Build Keycloak theme
        working-directory: frontend
        run: pnpm --filter @green-ecolution/keycloak-theme run build-keycloak-theme
      - name: Verify theme artifact
        run: test -f frontend/keycloak-theme/dist_keycloak/keycloak-theme.jar

  check_generated:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Dump OpenAPI spec from Rust backend
        run: just dump-openapi
      - name: Generate frontend code
        working-directory: ./frontend
        run: pnpm generate:local
      - name: Check generated code is fresh
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "::error::Generated frontend code is out of date."
            echo "Please run 'just generate-frontend' locally and commit the updated files (api-docs.json + src/)."
            echo
            git status --short
            echo
            git diff
            exit 1
          fi
          echo "Generated frontend code is up to date."

  frontend-pr-ok:
    name: Frontend PR OK
    if: always()
    needs:
      [build, lint, test, handbook, test_dockerfile, keycloak_theme, check_generated]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify all jobs passed
        run: |
          results=(
            "${{ needs.build.result }}"
            "${{ needs.lint.result }}"
            "${{ needs.test.result }}"
            "${{ needs.handbook.result }}"
            "${{ needs.test_dockerfile.result }}"
            "${{ needs.keycloak_theme.result }}"
            "${{ needs.check_generated.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::One or more jobs failed or were cancelled ($r)"
              exit 1
            fi
          done
