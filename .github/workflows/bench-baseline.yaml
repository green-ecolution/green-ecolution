name: "Benchmark Baseline"

on:
  schedule:
    # Monday and Thursday. Twice a week keeps the baseline cache inside the
    # seven-day eviction window even when a run is delayed or skipped.
    - cron: "0 4 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: "true"

      # The previous run's measurements, if any were ever stored. The first run
      # has nothing to compare against and only records. Cache entries are
      # immutable, so the key rotates per run and the prefix restores the
      # newest one; a fixed key would pin every run to the very first baseline.
      - name: Restore previous baseline
        uses: actions/cache/restore@v4
        with:
          path: backend/target/criterion
          key: criterion-baseline-${{ github.run_id }}
          restore-keys: criterion-baseline-

      # Reports deviations in the log and the artifact, but never fails the
      # job: shared runners are too noisy for a timing gate. Promote this to a
      # real gate only once the numbers have proven stable over several weeks.
      - name: Run benchmarks
        working-directory: ./backend
        run: cargo bench -p domain --locked -- --save-baseline scheduled

      - name: Store baseline
        uses: actions/cache/save@v4
        with:
          path: backend/target/criterion
          key: criterion-baseline-${{ github.run_id }}

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: criterion-report
          path: backend/target/criterion
          retention-days: 90
