[package]
name = "domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Green Ecolution domain layer"
readme = "../../../README.md"
publish.workspace = true
# benches/fixtures.rs is a module of the `scaling` bench, not a bench of its own.
autobenches = false

[lib]
path = "src/lib.rs"
# No #[bench] fns here; otherwise `cargo bench` also runs the libtest harness,
# which rejects criterion flags like --save-baseline.
bench = false

[features]
default = []
sqlx = ["dep:sqlx"]

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde", "wasmbind"] }
rust_decimal = { version = "1.42", default-features = false, features = ["serde"] }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

# Optional, nur wenn `sqlx`-Feature aktiv ist.
sqlx = { workspace = true, features = ["derive", "postgres", "chrono", "uuid", "json"], optional = true }

[dev-dependencies]
claims = "0.8"
criterion = { version = "0.8", features = ["html_reports"] }
quickcheck = "1"
quickcheck_macros = "1"

[[bench]]
name = "scaling"
harness = false
