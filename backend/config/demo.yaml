# Publicly reachable demo instance. Identical to production except that it
# deliberately runs without a login: `auth.enabled: false` makes every request
# an unrestricted anonymous one. Only the `demo` environment accepts that —
# staging and production refuse to start with it (see Settings::ensure_secure).
application:
  host: "0.0.0.0"
  base_url: "https://demo.green-ecolution.de"
database:
  require_ssl: true
  max_connections: 20
log:
  level: "info,sqlx=warn"
  format: "json"
cors:
  allowed_origins:
    - "https://demo.green-ecolution.de"
auth:
  enabled: false
  # Unused while `enabled: false`, but still required: the Keycloak client is
  # constructed unconditionally and parses issuer_url. Override via env if the
  # demo ever gains a login.
  issuer_url: "http://localhost/realms/green-ecolution"
  frontend_client_id: "frontend"
  backend_client_id: "backend"
  backend_client_secret: "unused-while-auth-is-disabled"
  default_redirect_url: "https://demo.green-ecolution.de/auth/callback"
